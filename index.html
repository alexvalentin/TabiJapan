<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tabi"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Tabi Japan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14213d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concept: semnalistica din gările japoneze. Fiecare zi e o "stație" cu cod (T16, K22, O27), culoarea liniei = orașul.
   Aplicație mobile-first: bară de navigare jos, banda de zile lipită sus, bife sincronizate live între telefoane. */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface2:#f5f6f9; --ink:#14213d; --muted:#5a6578; --line:#d9dee7;
  --tokyo:#2447c8; --kyoto:#c0332b; --osaka:#b86a00;
  --ok:#17784a; --ok-bg:#dff3e8; --warn:#9a4a05; --warn-bg:#fdecd2; --info:#41506b; --info-bg:#e6eaf2;
  --on-city:#ffffff; --shadow:0 1px 2px rgba(20,33,61,.06); --sky:none; --band:var(--bg);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="ghibli"]):not([data-theme="sakura"]){
    --bg:#0c1220; --surface:#151d2f; --surface2:#1b2538; --ink:#e8ecf5; --muted:#9aa6bd; --line:#27324a;
    --tokyo:#6f8dff; --kyoto:#ff7a70; --osaka:#f0a23a;
    --ok:#5fd394; --ok-bg:#12382a; --warn:#f3b36a; --warn-bg:#3a2a12; --info:#a9b6cf; --info-bg:#222d44;
    --on-city:#0c1220; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1220; --surface:#151d2f; --surface2:#1b2538; --ink:#e8ecf5; --muted:#9aa6bd; --line:#27324a;
  --tokyo:#6f8dff; --kyoto:#ff7a70; --osaka:#f0a23a;
  --ok:#5fd394; --ok-bg:#12382a; --warn:#f3b36a; --warn-bg:#3a2a12; --info:#a9b6cf; --info-bg:#222d44;
  --on-city:#0c1220; --shadow:none; color-scheme:dark;
}
/* Tema Ghibli: pajiște, hârtie caldă, cer cu nori moi */
:root[data-theme="ghibli"]{
  --bg:#dbe9d6; --surface:#fcf9ee; --surface2:#f0eedc; --ink:#243a3a; --muted:#587068; --line:#c3d6bf;
  --tokyo:#3777b3; --kyoto:#c4553d; --osaka:#c98310;
  --ok:#2c7a4c; --ok-bg:#d3ebd5; --warn:#955608; --warn-bg:#f7e4b6; --info:#44625f; --info-bg:#d0e4e1;
  --on-city:#fffdf2; --shadow:0 2px 0 rgba(36,58,58,.07); color-scheme:light;
  --band:#bfdcef;
  --sky:radial-gradient(ellipse 80px 24px at 80% 64px,rgba(255,255,255,.9),transparent 72%),radial-gradient(ellipse 120px 30px at 18% 116px,rgba(255,255,255,.75),transparent 72%),radial-gradient(ellipse 60px 18px at 56% 150px,rgba(255,255,255,.6),transparent 72%),linear-gradient(#bfdcef 0,#dbe9d6 380px);
}
:root[data-theme="ghibli"] .card,:root[data-theme="ghibli"] .stat,:root[data-theme="ghibli"] .hotel,:root[data-theme="sakura"] .card,:root[data-theme="sakura"] .stat,:root[data-theme="sakura"] .hotel{border-radius:18px}
/* Tema Ghibli roz: petale de cireș, hârtie caldă, cer roz */
:root[data-theme="sakura"]{
  --bg:#f8e2ea; --surface:#fcf9ee; --surface2:#fbeef3; --ink:#4a2838; --muted:#86596f; --line:#ecc8d6;
  --tokyo:#4a5fb8; --kyoto:#c23f5c; --osaka:#b86a1c;
  --ok:#2f7a52; --ok-bg:#dcefe2; --warn:#955608; --warn-bg:#fae6c2; --info:#6a4b5e; --info-bg:#f3dbe5;
  --on-city:#fffafb; --shadow:0 2px 0 rgba(74,40,56,.07); color-scheme:light;
  --band:#f6c6d6;
  --sky:radial-gradient(ellipse 80px 24px at 80% 64px,rgba(255,255,255,.9),transparent 72%),radial-gradient(ellipse 120px 30px at 18% 116px,rgba(255,255,255,.75),transparent 72%),radial-gradient(ellipse 60px 18px at 56% 150px,rgba(255,255,255,.6),transparent 72%),linear-gradient(#f6c6d6 0,#f8e2ea 380px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg); background-image:var(--sky); background-repeat:no-repeat; background-size:100% 420px; color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px; -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
.wrap{max-width:720px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}

/* Antet */
header.top{padding-top:18px;display:flex;flex-direction:column;gap:12px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--f-head);font-weight:700;font-size:30px;line-height:1.05;margin:0;letter-spacing:-.01em}
.sub{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.02em}
.sync{font-family:var(--f-mono);font-size:11px;display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block}
.sync{font-weight:500}
.sync.live{color:var(--ok)} .sync.live i{background:var(--ok);position:relative}
.sync.live i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ok);animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.65}100%{transform:scale(3.2);opacity:0}}
.sync.warn{color:var(--warn)} .sync.warn i{background:#f2b705}
@media (prefers-reduced-motion:reduce){.sync.live i::after{animation:none;opacity:0}}
.stats{display:grid;grid-template-columns:1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat b{font-family:var(--f-head);font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>div{height:100%;background:var(--ok);width:0;transition:width .3s}

.top-r{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.themes{position:relative}
.thb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 9px 4px 5px;min-height:32px;color:var(--ink)}
.thb svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:block;flex:0 0 auto}
.thm{position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:216px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:2px}
.thi{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:13px;padding:10px 12px;font-size:16px;color:var(--ink);text-align:left;width:100%}
.thi .sw{width:28px;height:28px}
.thi span{flex:1}
.thi[aria-checked="true"]{background:var(--info-bg);font-weight:700}
.thi svg{width:18px;height:18px;stroke:var(--ok);fill:none;stroke-width:2.4}
/* Ecran de pornire: cerul si dealurile din spatele steagului */
#splash{position:fixed;inset:0;z-index:200;background:linear-gradient(#7ab9e6 50%,#4f9d5c 50%);display:grid;place-items:center;animation:splashOut .5s ease 2.6s forwards;cursor:pointer}
#splash svg{position:absolute;inset:0;width:100%;height:100%}
#splash b{position:absolute;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--f-head);font-size:34px;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(36,58,58,.25)}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{animation-duration:.01s;animation-delay:2.2s}}
/* Banda de zile */
.strip{padding:16px 0 8px;display:flex;flex-direction:column;gap:16px}
.dgroup{display:flex;flex-direction:column;gap:8px}
.dg-h{display:flex;align-items:center;gap:10px}
.dg-h::before{content:"";width:18px;height:5px;background:var(--cc);border-radius:2px}
.dg-h b{font-family:var(--f-head);font-size:20px;font-weight:700;color:var(--ink);line-height:1}
.dg-h span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
#daysec{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 8px)}
.chip{flex:0 0 auto;scroll-snap-align:center;text-decoration:none;min-width:0;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;position:relative}
.chip .band{height:5px;background:var(--cc)}
.chip .code{font-family:var(--f-mono);font-weight:500;font-size:22px;padding:12px 8px 0;text-align:center;font-variant-numeric:tabular-nums}
.chip .wd{font-size:14px;color:var(--muted);padding:2px 8px 4px;text-align:center}
.chip.sel{background:var(--cc);border-color:var(--cc);color:var(--on-city)}
.chip.sel .band{background:rgba(255,255,255,.35)}
.chip.sel .wd{color:inherit;opacity:.85}
.chip.today::after{content:"azi";position:absolute;top:13px;right:9px;font-size:10px;font-family:var(--f-mono);opacity:.9;color:var(--cc)}
.chip.sel.today::after{color:var(--on-city)}
.tokyo{--cc:var(--tokyo)} .kyoto{--cc:var(--kyoto)} .osaka{--cc:var(--osaka)}

/* Zi */
.dayhead{display:flex;flex-direction:column;gap:4px;padding:6px 0 14px}
.dayhead .city{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cc);font-weight:500}
.dayhead h2{font-family:var(--f-head);font-size:26px;line-height:1.1;margin:0;font-weight:700;text-wrap:balance}
.dayhead .date{color:var(--muted);font-size:14px}
.notice{background:var(--info-bg);color:var(--info);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.hotel{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.hotel small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.hotel div{min-width:0}
ul.stops{list-style:none;margin:0;padding:0 14px;display:flex;flex-direction:column;gap:0;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
ul.stops:empty{display:none}
ul.stops .stop:last-child{border-bottom:0}
.stop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:0}
.chk{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0;margin:-6px 0 0 -8px}
.chk span{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk svg{width:16px;height:16px;opacity:0;stroke:var(--on-city)}
.chk[aria-pressed="true"] span{background:var(--cc);border-color:var(--cc)}
.chk[aria-pressed="true"] svg{opacity:1}
.sph{grid-column:1/-1;display:block;width:100%;height:170px;object-fit:cover;border-radius:12px;margin-top:6px}
.st3{display:flex;gap:6px;flex-direction:column;align-items:flex-end;margin-top:2px}
.st3.open{gap:6px}
.st3b{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;border:1.5px solid var(--line);background:var(--surface2);color:var(--muted);cursor:pointer}
.st3b.v.on{background:#2f9e5f;border-color:#2f9e5f;color:#fff}
.st3b.n.on{background:#f2c230;border-color:#f2c230;color:#3d2e00}
.st3b.c.on{background:#d24b3e;border-color:#d24b3e;color:#fff}
.stop.cancelled .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.stop .body{min-width:0;display:flex;flex-direction:column;gap:5px}
.line1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.time{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--cc);white-space:nowrap}
.name{font-family:var(--f-head);font-size:19px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.stop.done .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:0;line-height:1.3;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill.booked,.pill.got{background:var(--ok-bg);color:var(--ok)}
.pill.buy{background:var(--warn-bg);color:var(--warn);cursor:pointer;min-height:28px}
.pill.door,.pill.free{background:var(--info-bg);color:var(--info)}
.pill svg{width:12px;height:12px;stroke:currentColor}
.price{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted);max-width:60ch}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.links a{color:var(--cc);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}

/* Carduri generale */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-family:var(--f-head);font-size:20px;font-weight:700;line-height:1.15}
.card p{margin:0}
.kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--cc,var(--muted));font-weight:500}
.stack{display:flex;flex-direction:column;gap:12px;padding-top:14px}
h2.sec{font-family:var(--f-head);font-size:24px;margin:0;font-weight:700}
.lead{color:var(--muted);margin:4px 0 0;max-width:60ch}
.group-h{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cc);margin:14px 0 0;font-weight:500;display:flex;gap:8px;align-items:center}
.group-h::before{content:"";width:18px;height:5px;background:var(--cc);border-radius:2px}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 6px;padding:12px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.trow.done .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:13px}
.wx{margin-bottom:12px}
.cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cs .card b{font-family:var(--f-mono);font-size:20px;font-weight:500}
.cs .card small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.crow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.crow .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.crow h3{margin:0;font-size:16px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.crow .am{font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.crow .am span{color:var(--muted)}
.crow .got{font-size:11px;font-family:var(--f-mono);padding:2px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.crow .edit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crow label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.crow input[type=number]{font:inherit;font-family:var(--f-mono);font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.crow label.cchk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink);grid-column:1/-1;white-space:nowrap}
.crow .cchk input{width:20px;height:20px}
.cbtn{font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);cursor:pointer}
.cbtn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tg{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px 10px;font-family:var(--f-mono);font-size:12px;align-items:baseline}
.tg span:not(:first-child){text-align:right;white-space:nowrap}
.crow .cmeta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.crow .cmeta a{color:var(--ink);font-weight:600}
.crow .cmeta b{color:var(--ink);font-weight:600}
.addf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addf label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.addf .full{grid-column:1/-1}
.addf input[type=text],.addf input[type=number],.addf select,.addf textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.addf textarea{min-height:64px;resize:vertical}
.addf .cchk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.addf .cchk input{width:20px;height:20px}
.crow .acts{display:flex;justify-content:flex-end}
.wi{display:inline-block;vertical-align:middle}
.wi svg{width:100%;height:100%;display:block}
.chip .wc{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--f-mono);font-size:12px;color:var(--muted);min-height:20px;padding:0 6px 10px}
.chip.sel .wc{color:inherit;opacity:.95}
.chip .wc .wi{width:18px;height:18px}
.wxsum .wi{width:36px;height:36px;align-self:center}
.wxh .wi{width:34px;height:34px}
.wxsum{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.wxsum b{font-family:var(--f-head);font-size:28px;font-weight:700;line-height:1}
.wxsum span{font-size:14px;color:var(--muted)}
.wxrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.wxh{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-radius:14px;background:var(--surface2);font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.wxh b{font-size:20px;color:var(--ink);font-weight:500}
.wxh.now{background:var(--cc,var(--accent));color:#fff}
.wxh.now b,.wxh.now span{color:#fff}
.wxh .hi{color:var(--warn);font-weight:600}
.sub-h{font-family:var(--f-head);font-size:17px;font-weight:700;margin:8px 0 0}

function wxFetch(city){
  var o=WXD[city]||wxCache(city);
  if(o)WXD[city]=o;
  if(o&&Date.now()-o.t<3600000)return;
  if(WXP[city]||(WXT[city]&&Date.now()-WXT[city]<60000))return;
  WXP[city]=true;WXT[city]=Date.now();
  var c=WXC[city], ctl=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort();},9000);
  var url="https://api.open-meteo.com/v1/forecast?latitude="+c.la+"&longitude="+c.lo+"&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16";
  fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){if(!r.ok)throw new Error("http");return r.json();}).then(function(j){
    clearTimeout(to);WXP[city]=false;WXERR[city]=false;
    var n={t:Date.now(),h:j.hourly,d:j.daily};WXD[city]=n;
    try{localStorage.setItem("tabi-wx-"+city,JSON.stringify(n));}catch(e){}
    wxPaint();
  }).catch(function(){clearTimeout(to);WXP[city]=false;WXERR[city]=true;wxPaint();});
}

  sbQ={};sbSaveQ();mode="local";renderSync();render(true);toast("Deconectat. Datele rămân pe acest telefon.");
}
function sbInfo(){
  var el=document.getElementById("sb-status");if(!el)return;
  el.textContent=sbStatus();
}
function sbStatus(){
  if(!sbOn())return "Neconectat. Datele se salvează doar pe acest telefon.";
  var n=Object.keys(sbQ).length;
  if(sbErr)return "Fără legătură la server ("+(sbErr==="offline"?"fără internet":sbErr)+"). "+(n?n+" schimbări așteaptă să fie trimise.":"Se reîncearcă singur.");
  if(!sbLast)return "Se conectează…";
  var d=new Date(sbLast), t=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);
  return "Sincronizat la "+t+(n?", "+n+" de trimis":"")+".";
}
function viewSync(){
  var h='<div class="card" id="sbcard"><h3>Sincronizare între telefoane</h3>';
  if(sbOn()){
    h+='<p>Conectat cu codul <b>'+new Array(sbCode.length+1).join('•')+'</b></p><p class="note" id="sb-status">'+esc(sbStatus())+'</p>'+
       '<div class="acts"><button class="cbtn" data-sbd="1">Deconectează</button></div>';
  }else{
    h+='<p>Scrie același cod pe fiecare telefon, ca să vedeți aceleași bife și cheltuieli în timp real. Minimum 4 caractere. Nu îl da altcuiva.</p>'+
       '<div class="addf"><label class="full">Cod de grup<input type="text" id="sb-code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="minimum 4 caractere"></label></div>'+
       '<p class="note" id="sb-status">'+esc(sbStatus())+'</p><div class="acts"><button class="cbtn pri" data-sbc="1">Conectează</button></div>';
  }
  return h+'</div>';
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)sbKick(0);});
window.addEventListener("online",function(){sbKick(0);});
window.addEventListener("focus",function(){sbKick(0);});
document.addEventListener("focusout",function(){if(sbDirty)setTimeout(function(){if(sbDirty&&!sbEditing()){sbDirty=false;render(true);}},300);});

parseHash();render(false);
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){initDb();sbStart();});else{initDb();sbStart();}
})();
</script>
